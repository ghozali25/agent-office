<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Prototipe Kantor Virtual 3D</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <div id="labels"></div>
        <div id="topbar">
          <button class="tbtn" id="btnMeeting" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9.5" cy="7.5" r="3.5"/><path d="M22 21v-2a4 4 0 0 0-3-3.85M15.5 4.15a3.5 3.5 0 0 1 0 6.7"/></svg>
            Panggil Rapat
          </button>
          <button class="tbtn" id="btnSound" type="button" aria-pressed="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.6 5.4a9 9 0 0 1 0 13.2"/></svg>
            Suara
          </button>
          <button class="tbtn" id="btnDemo" type="button" aria-pressed="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="6 3 20 12 6 21 6 3" fill="currentColor" stroke="none"/></svg>
            Demo Otomatis
          </button>
          <button class="tbtn" id="btnPhase" type="button" title="Siklus siang–malam otomatis — ketuk untuk melompat ke fase berikutnya">
            <span id="phaseIcon" style="display:inline-flex"></span>
            <span id="phaseTxt">Siang</span>
          </button>
          <div class="tsep"></div>
          <div class="cams" role="group" aria-label="Sudut kamera">
            <button class="tbtn" type="button" data-cam="iso">Isometrik</button>
          </div>
        </div>
        <div id="bootmsg" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:4;font-weight:700;font-size:15px;color:#dfe7ee;background:radial-gradient(120% 90% at 50% 38%, #1d1e23, #07080a)">Memuat kantor 3D…</div>
        <div id="soundHint"></div>
        <div id="errbox" role="alert"></div>
      </div>

      <aside id="panel">
        <p id="modelStatus" class="stylestatus" hidden></p>
        <button class="btn ghost" id="btnRetryVrm" type="button" hidden style="margin:0 0 13px">Coba Muat Ulang Model</button>

        <section class="sec">
          <h2>Kirim Tugas</h2>
          <div class="card">
            <form id="taskForm">
              <label class="f" for="taskTitle">Judul tugas</label>
              <input type="text" id="taskTitle" placeholder="cth. Riset harga BBCA minggu ini" maxlength="70" autocomplete="off" />
              <label class="f" for="taskAgent">Ditugaskan ke</label>
              <select id="taskAgent">
                <option value="auto">Otomatis (agen yang bebas)</option>
              </select>
              <button class="btn primary" type="submit">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
                Kirim Tugas
              </button>
            </form>
            <button class="btn ghost" id="btnRandom" type="button">Beri Tugas Acak</button>
          </div>
        </section>

        <section class="sec">
          <h2>Antrean Tugas</h2>
          <div id="taskList"><p class="empty">Belum ada tugas. Kirim tugas pertama lewat formulir di atas.</p></div>
        </section>

        <section class="sec">
          <h2>Tim</h2>
          <div id="roster"></div>
        </section>

        <section class="sec">
          <h2>Aktivitas</h2>
          <ul id="log"></ul>
        </section>
      </aside>
    </div>

    <script async src="three.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
